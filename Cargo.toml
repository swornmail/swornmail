[package]
name = "swornmail"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Verifier for the SwornMail protocol (cryptographic IPv6 prefix attestation for email senders): Mode-2 COSE_Sign1 connection tokens and operator DNS records. Early development — protocol draft in progress."
license = "Apache-2.0"
repository = "https://github.com/swornmail/swornmail"
homepage = "https://swornmail.dev"
keywords = ["email", "smtp", "ipv6", "reputation", "attestation"]
categories = ["email"]
# The differential-test bin is dev tooling (gate B), not part of the crate.
exclude = ["src/bin/difftest.rs"]

[dependencies]
base64 = "0.22"
ciborium = "0.2"
ed25519-dalek = "3.0"

[dev-dependencies]
hex = "0.4"
serde_json = "1.0"
