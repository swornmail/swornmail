name: Public boundary

# This repository is public and carries the open SwornMail protocol.
#
# The reputation feed, any customer console, and anything behind a paid tier or
# a login are commercial and live in a private repository. That boundary has
# been held by everyone remembering it; this is the backstop.
#
# It runs before merge because a leak here is not revertible in any useful
# sense: content is public the moment it is pushed, and rewriting history does
# not recall what was already fetched, forked, or indexed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No private-side identifiers
        env:
          PRIVATE_IDENTIFIERS: ${{ secrets.PRIVATE_IDENTIFIERS }}
          FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          # Names that exist only on the commercial side. Any occurrence in a
          # public repository is a boundary failure.
          #
          # Deliberately NOT matched: "commercial", "feed" and "reputation" on
          # their own. The protocol legitimately discusses reputation, and the
          # Apache licence text contains "commercial damages"; banning the
          # vocabulary would produce noise, not safety. No company name appears
          # in public material at all as of 2026-08-28 — the maintainer credit
          # is personal.
          patterns='sworn-feed|sworn_feed|SWORN_FEED_|submitter-keys'

          # The rest of the private-side names are in a repository secret, so
          # this file does not publish them itself; a secret, unlike a
          # variable, is also masked in these public logs. On main and on
          # branches of this repository a missing secret fails the check: an
          # unset secret must not read as "nothing to find". A pull request
          # from a fork never receives secrets, so there only the names above
          # are checked, and the run on main after merge checks the rest.
          if [ -n "$PRIVATE_IDENTIFIERS" ]; then
            # The secret is typed by hand, so it is checked before it is
            # trusted. A stray "|" or newline leaves an empty alternative,
            # which matches every line; and the names it holds must not have
            # found their way back into this file, which the scan below skips.
            if printf '\n' | grep -qE -- "$PRIVATE_IDENTIFIERS"; then
              echo "::error::PRIVATE_IDENTIFIERS matches an empty line; check it for a stray | or newline"
              exit 1
            fi
            if grep -qE -- "$PRIVATE_IDENTIFIERS" .github/workflows/public-boundary.yml; then
              echo "::error::a name held in PRIVATE_IDENTIFIERS appears in this workflow file"
              exit 1
            fi
            patterns="$patterns|$PRIVATE_IDENTIFIERS"
          elif [ "$FROM_FORK" = "true" ]; then
            echo "::notice::pull request from a fork: only the names in this file were checked"
          else
            echo "::error::the PRIVATE_IDENTIFIERS secret is not set, so the boundary cannot be checked"
            exit 1
          fi

          # Tracked files only, skipping this workflow, which names what it
          # looks for. git grep exits 1 for no match and higher for a pattern
          # that does not compile; only 1 is a clean tree. Treating every
          # failure as "nothing found" would let a mistyped secret switch the
          # whole check off.
          rc=0
          git grep -nIE "$patterns" -- . ':!.github/workflows/public-boundary.yml' > /tmp/hits || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::private-side identifiers found in a PUBLIC repository"
            # Locations only. The matched text is exactly what must not be
            # printed into a public log, and masking covers the secret as a
            # whole, not the one name that matched.
            cut -d: -f1,2 /tmp/hits
            echo
            echo "The feed, its console, and anything behind a paid tier or login"
            echo "belong in a private repo."
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::the boundary pattern did not compile, so nothing was checked"
            exit 1
          fi
          echo "no private-side identifiers"

      - name: No credentials committed
        run: |
          # Cheap checks for the things that would actually hurt. Not a
          # substitute for secret scanning, which GitHub runs separately.
          #
          # Test keys are excluded by path, not by weakening the pattern: the
          # conformance vectors legitimately contain a published Ed25519 seed,
          # which is the point of a test vector.
          patterns='AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[0-9A-Za-z-]{10,}|postgres(ql)?://[^ "]*:[^ "@]*@'

          if git grep -nIE "$patterns" -- . \
               ':!.github/workflows/public-boundary.yml' \
               ':!test-vectors/**' ':!**/testdata/**' > /tmp/creds; then
            echo "::error::possible credential committed to a PUBLIC repository"
            cat /tmp/creds
            exit 1
          fi
          echo "no credential patterns"

      - name: No claim of adopters while there are none
        run: |
          # SwornMail has no public deployments. If that changes, the copy
          # should change because Val decided it, not because a marketing
          # phrase drifted in from a template.
          if git grep -nIE 'trusted by|used by [0-9]|our customers|thousands of' -- . \
               ':!.github/workflows/public-boundary.yml' > /tmp/claims; then
            echo "::error::public material implies adoption that does not exist"
            cat /tmp/claims
            exit 1
          fi
          echo "no unsupported adoption claims"
